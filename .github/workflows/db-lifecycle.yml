name: DB Lifecycle

on:
  schedule:
    # 02:00 UTC (23:00 em Brasília) — todo dia, garante que não fica ligado de madrugada.
    - cron: "0 2 * * *"
    # 09:00 UTC (06:00 em Brasília) — todo dia, liga o banco. O texto do cron
    # abaixo precisa ser idêntico ao usado em ACTION (compara com github.event.schedule).
    # Janela ligada: 06:00 a 23:00 em Brasília (~17h/dia). Decisão D1 de 2026-10-15.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "start ou stop"
        required: true
        type: choice
        options: [start, stop]
        default: stop

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: cashtrail-rg
  SERVER_NAME: cashtrail-db-16143

jobs:
  db-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # start/stop falham se o servidor já está no estado pedido, então checa antes.
      - name: Start or stop Postgres
        env:
          ACTION: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 9 * * *' && 'start' || 'stop') || inputs.action }}
        run: |
          state=$(az postgres flexible-server show --resource-group $RESOURCE_GROUP --name $SERVER_NAME --query state -o tsv)
          echo "Action: $ACTION | current state: $state"
          if [ "$ACTION" = "start" ] && [ "$state" = "Stopped" ]; then
            az postgres flexible-server start --resource-group $RESOURCE_GROUP --name $SERVER_NAME
          elif [ "$ACTION" = "stop" ] && [ "$state" = "Ready" ]; then
            az postgres flexible-server stop --resource-group $RESOURCE_GROUP --name $SERVER_NAME
          else
            echo "Nothing to do."
          fi
