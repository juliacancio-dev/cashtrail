name: DB Lifecycle

on:
  schedule:
    # 23:17 UTC (20:17 em Brasília) — desliga; com o atraso medido cai entre 00:17 e 03:17.
    # O texto deste cron precisa ser idêntico ao usado em ACTION (compara com github.event.schedule).
    - cron: "17 23 * * *"
    # 03:17, 06:17 e 09:17 UTC (00:17, 03:17 e 06:17 em Brasília) — liga. São três
    # tentativas porque o atraso varia; a primeira que rodar liga e as outras não fazem nada.
    - cron: "17 3 * * *"
    - cron: "17 6 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "start ou stop"
        required: true
        type: choice
        options: [start, stop]
        default: stop

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: cashtrail-rg
  SERVER_NAME: cashtrail-db-16143

jobs:
  db-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # start/stop falham se o servidor já está no estado pedido, então checa antes.
      - name: Start or stop Postgres
        env:
          ACTION: ${{ github.event_name == 'schedule' && (github.event.schedule == '17 23 * * *' && 'stop' || 'start') || inputs.action }}
        run: |
          state=$(az postgres flexible-server show --resource-group $RESOURCE_GROUP --name $SERVER_NAME --query state -o tsv)
          echo "Action: $ACTION | current state: $state"
          if [ "$ACTION" = "start" ] && [ "$state" = "Stopped" ]; then
            az postgres flexible-server start --resource-group $RESOURCE_GROUP --name $SERVER_NAME
          elif [ "$ACTION" = "stop" ] && [ "$state" = "Ready" ]; then
            az postgres flexible-server stop --resource-group $RESOURCE_GROUP --name $SERVER_NAME
          else
            echo "Nothing to do."
          fi
