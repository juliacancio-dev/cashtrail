name: Deploy

# Manual de propósito: deploys são feitos em lote, não a cada push na main.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: cashtrail-rg
  ACR_NAME: acrcashtrail
  DB_SERVER_NAME: cashtrail-db-16143
  BACKEND_APP: cashtrail-backend
  FRONTEND_APP: cashtrail-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      # O db-lifecycle desliga o banco toda noite; o backend roda as migrations
      # na subida e quebra se o Postgres estiver parado.
      - name: Ensure Postgres is running
        run: |
          # Estados transitórios (Stopping/Starting/Updating): espera assentar antes de decidir.
          for i in $(seq 1 60); do
            state=$(az postgres flexible-server show -g "$RESOURCE_GROUP" -n "$DB_SERVER_NAME" --query state -o tsv)
            echo "[$i] Postgres state: $state"
            case "$state" in
              Ready) exit 0 ;;
              Stopped) az postgres flexible-server start -g "$RESOURCE_GROUP" -n "$DB_SERVER_NAME" -o none; exit 0 ;;
              *) sleep 15 ;;
            esac
          done
          echo "::error::Postgres did not reach Ready/Stopped state in time (last: $state)."
          exit 1

      - name: Build backend image
        working-directory: backend
        run: |
          az acr build --registry "$ACR_NAME" \
            --image "cashtrail-backend:$IMAGE_TAG" \
            --image cashtrail-backend:latest \
            --file Dockerfile .

      - name: Deploy backend
        run: |
          az containerapp update -g "$RESOURCE_GROUP" -n "$BACKEND_APP" \
            --image "$ACR_NAME.azurecr.io/cashtrail-backend:$IMAGE_TAG" \
            --set-env-vars ENABLE_SCHEDULER=true "APP_VERSION=$IMAGE_TAG" \
            --only-show-errors -o none

      # Ambiente Express não aceita revision suffix nem preenche
      # latestReadyRevisionName, então a prova de que a versão nova subiu
      # (migrations incluídas) é o /health devolver o SHA deste deploy.
      - name: Wait for new backend version to be live
        run: |
          fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n "$BACKEND_APP" --query properties.configuration.ingress.fqdn -o tsv --only-show-errors)
          for i in $(seq 1 40); do
            body=$(curl -sS --max-time 15 "https://$fqdn/health" 2>&1 || true)
            echo "[$i] $body"
            case "$body" in
              *"\"version\":\"$IMAGE_TAG\""*) echo "Backend live on $IMAGE_TAG"; exit 0 ;;
            esac
            sleep 15
          done
          echo "::error::Backend never reported version $IMAGE_TAG. Check the Log stream (migration failure? DB stopped? invalid env var?)."
          exit 1

      # NEXT_PUBLIC_API_URL é embutida no build (static export), então vem do
      # FQDN real do backend em vez de ficar hardcoded aqui.
      - name: Build frontend image
        working-directory: frontend
        run: |
          fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n "$BACKEND_APP" --query properties.configuration.ingress.fqdn -o tsv)
          az acr build --registry "$ACR_NAME" \
            --image "cashtrail-frontend:$IMAGE_TAG" \
            --image cashtrail-frontend:latest \
            --build-arg "NEXT_PUBLIC_API_URL=https://$fqdn" \
            --file Dockerfile .

      - name: Deploy frontend
        run: |
          az containerapp update -g "$RESOURCE_GROUP" -n "$FRONTEND_APP" \
            --image "$ACR_NAME.azurecr.io/cashtrail-frontend:$IMAGE_TAG" \
            --only-show-errors -o none
          fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n "$FRONTEND_APP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Frontend: https://$fqdn" >> "$GITHUB_STEP_SUMMARY"
