services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cashtrail
      POSTGRES_PASSWORD: cashtrail
      POSTGRES_DB: cashtrail
    ports:
      - "5544:5432"
    volumes:
      - cashtrail_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashtrail"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://cashtrail:cashtrail@db:5432/cashtrail
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  cashtrail_db_data:
